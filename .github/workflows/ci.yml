name: CI

on:
  push:
    branches: [main, feat/image-service]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      # Integration tests start Postgres through testcontainers-go, which uses
      # the Docker daemon available on GitHub-hosted Ubuntu runners.
      - name: Test
        run: go test -race -count=1 ./...

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      # Placeholder values: the chart requires them, and real ones live with the deployment.
      - name: Lint
        run: helm lint deploy/chart --set baseURL=https://example.org --set image.tag=test
      - name: Render
        run: helm template georef deploy/chart --set baseURL=https://example.org --set image.tag=test > /dev/null

  image:
    name: Image (${{ matrix.target }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [server, worker]
    env:
      # Pull requests build without publishing.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Save deploy digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/image-service'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/deploy-digest-$TARGET"

      - name: Upload deploy digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/image-service'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-digest-${{ matrix.target }}
          path: ${{ runner.temp }}/deploy-digest-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

  deploy-tag:
    name: Publish deploy tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/image-service'
    needs: [chart, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Download deploy digests
        uses: actions/download-artifact@v4
        with:
          pattern: deploy-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/deploy-digests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish paired images
        shell: bash
        run: |
          deploy_tag="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"

          check_branch_head() {
            local remote_ref
            remote_ref=$(git ls-remote origin "$GITHUB_REF")
            if [[ "${remote_ref%%[[:space:]]*}" != "$GITHUB_SHA" ]]; then
              echo "Skipping deploy tag because $GITHUB_REF no longer points to $GITHUB_SHA."
              exit 0
            fi
          }

          inspect_digest() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1"
          }

          verify_digest() {
            local reference=$1 expected=$2 actual
            actual=$(inspect_digest "$reference")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$reference resolved to $actual, expected $expected"
              exit 1
            fi
          }

          check_branch_head
          images_to_publish=()
          # Image Updater watches server. Publish it after the matching worker is available.
          for target in worker server; do
            image="$image_prefix-$target"
            digest=$(cat "$RUNNER_TEMP/deploy-digests/deploy-digest-$target")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid build digest for $image"
              exit 1
            fi
            source="$image@$digest"
            destination="$image:$deploy_tag"
            verify_digest "$source" "$digest"
            if actual=$(inspect_digest "$destination" 2>&1); then
              if [[ "$actual" != "$digest" ]]; then
                echo "::error::$destination already points to $actual, expected $digest"
                exit 1
              fi
            elif [[ "$actual" == *"$destination: not found" ]]; then
              images_to_publish+=("$source")
            else
              printf '%s\n' "$actual" >&2
              exit 1
            fi
          done

          for source in "${images_to_publish[@]}"; do
            destination="${source%@*}:$deploy_tag"
            check_branch_head
            docker buildx imagetools create --prefer-index=false --tag "$destination" "$source"
            verify_digest "$destination" "${source##*@}"
          done
