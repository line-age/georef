version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
  settings:
    staticcheck:
      # SA* = staticcheck, S1* = former gosimple. Quickfix (QF*) and
      # style (ST*) checks are left off.
      checks: ["SA*", "S1*"]
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
      # SA1019: feature/s3/manager is marked deprecated in favour of
      # feature/s3/transfermanager, which is still a preview package and not
      # yet stable enough to depend on. Suppress until the replacement ships.
      - linters:
          - staticcheck
        text: "feature/s3/manager"
