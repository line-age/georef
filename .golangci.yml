version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
  settings:
    staticcheck:
      # SA* = staticcheck, S1* = former gosimple. Quickfix (QF*) and
      # style (ST*) checks are left off.
      checks: ["SA*", "S1*"]
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
      # The AWS S3 upload helper we use (feature/s3/manager) has been flagged
      # as "old — use the new one instead". The new one (transfermanager) is
      # not finished yet and not safe to use in production. We'll switch once
      # it is released. Until then, silence the warning so CI stays green.
      - linters:
          - staticcheck
        text: "feature/s3/manager"
