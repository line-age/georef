services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: georef
      POSTGRES_USER: georef
      POSTGRES_PASSWORD: georef
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose locally for psql / migration tools during development.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georef"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Internal image server — not reachable from outside the compose network
  # by design (no ports: mapping). The front service proxies to it.
  # See docs/image-service.md for Cantaloupe config details (Stage 6+).
  cantaloupe:
    image: uclalibrary/cantaloupe:latest
    environment:
      CANTALOUPE_SOURCE_STATIC: FilesystemSource
      CANTALOUPE_FILESYSTEMSOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: /data/storage/
    volumes:
      - storage_data:/data/storage:ro

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: server
    environment:
      DATABASE_URL: postgres://georef:georef@postgres:5432/georef
      IMAGE_SERVER_URL: http://cantaloupe:8182
      STORAGE_BACKEND: filesystem
      STORAGE_PATH: /data/storage
      BASE_URL: http://localhost:8080
    volumes:
      - storage_data:/data/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      cantaloupe:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://georef:georef@postgres:5432/georef
      STORAGE_BACKEND: filesystem
      STORAGE_PATH: /data/storage
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
