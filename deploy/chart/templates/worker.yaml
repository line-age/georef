apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "georef.fullname" . }}-worker
  labels:
    {{- include "georef.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  # Never two workers across a rollout.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "georef.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "georef.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "georef.dbEnv" . | nindent 12 }}
            {{- include "georef.envMap" .Values.worker.env | nindent 12 }}
          {{- with .Values.worker.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef: {name: {{ . }}}
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: storage, mountPath: /data/storage}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: {{ include "georef.claim" . }}}
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.worker.tmpSizeLimit }}}
