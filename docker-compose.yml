services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: georef
      POSTGRES_USER: georef
      POSTGRES_PASSWORD: georef
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose on 5433 locally to avoid conflicting with any host Postgres instance.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georef"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Internal image server — not reachable from outside the compose network
  # by design (no ports: mapping). The front service proxies to it.
  # See docs/image-service.md for Cantaloupe config details (Stage 6+).
  cantaloupe:
    image: uclalibrary/cantaloupe:5.0.7-2
    environment:
      CANTALOUPE_SOURCE_STATIC: FilesystemSource
      CANTALOUPE_FILESYSTEMSOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: /data/storage/
    volumes:
      - storage_data:/data/storage:ro

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: server
    environment:
      DATABASE_URL: postgres://georef:georef@postgres:5432/georef?sslmode=disable
      STORAGE_ROOT: /data/storage
      BASE_URL: http://localhost:8080
      ADDR: :8080
      # MAX_UPLOAD_SIZE: 1073741824
    volumes:
      - storage_data:/data/storage
    ports:
      - "8080:8080"
    # The server runs migrations via entrypoint.sh before starting.
    # The healthcheck lets the worker wait until the schema is ready and the
    # server is accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      cantaloupe:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://georef:georef@postgres:5432/georef?sslmode=disable
      STORAGE_ROOT: /data/storage
      POLL_INTERVAL: 5s
      # VIPS_TILE_WIDTH: 256
      # VIPS_TILE_HEIGHT: 256
    volumes:
      - storage_data:/data/storage
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
